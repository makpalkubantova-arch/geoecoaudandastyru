name: Firebase Hosting-ке жариялау
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  deploy:
    # FIREBASE_SERVICE_ACCOUNT құпиясы қосылғанша өткізіліп кетеді
    if: ${{ vars.FIREBASE_ON == '1' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: ekoaimaq
